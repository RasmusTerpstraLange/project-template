name: Deploy to Azure

# Fill in AZURE_FUNCTIONAPP_NAME and add AZURE_CREDENTIALS as a repo secret
# (Settings -> Secrets and variables -> Actions) before enabling this.
# This workflow is disabled by default (workflow_dispatch only) so it
# never deploys accidentally.

on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: "your-function-app-name"
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "backend/azure-functions"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          npm install
          npm run build --if-present
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
