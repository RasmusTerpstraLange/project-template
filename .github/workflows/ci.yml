name: CI

# Each job only builds its app once that app exists (has a package.json).
# Until then the job passes without doing anything, so a fresh project
# from this template does not start with failing checks.

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the mobile app has not been created yet
        if: hashFiles('apps/mobile/package.json') == ''
        working-directory: .
        run: echo "apps/mobile has no package.json yet - nothing to check."
      - uses: actions/setup-node@v4
        if: hashFiles('apps/mobile/package.json') != ''
        with:
          node-version: 22
      - if: hashFiles('apps/mobile/package.json') != ''
        run: npm install
      - if: hashFiles('apps/mobile/package.json') != ''
        run: npm run typecheck --if-present
      - if: hashFiles('apps/mobile/package.json') != ''
        run: npm test --if-present

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the web app has not been created yet
        if: hashFiles('apps/web/package.json') == ''
        working-directory: .
        run: echo "apps/web has no package.json yet - nothing to build."
      - uses: actions/setup-node@v4
        if: hashFiles('apps/web/package.json') != ''
        with:
          node-version: 20
      - if: hashFiles('apps/web/package.json') != ''
        run: npm install
      - if: hashFiles('apps/web/package.json') != ''
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/azure-functions
    steps:
      - uses: actions/checkout@v4
      - name: Skip if the backend has not been created yet
        if: hashFiles('backend/azure-functions/package.json') == ''
        working-directory: .
        run: echo "backend/azure-functions has no package.json yet - nothing to build."
      - uses: actions/setup-node@v4
        if: hashFiles('backend/azure-functions/package.json') != ''
        with:
          node-version: 20
      - if: hashFiles('backend/azure-functions/package.json') != ''
        run: npm install
      - if: hashFiles('backend/azure-functions/package.json') != ''
        run: npm run build --if-present
